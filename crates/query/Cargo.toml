[package]
name = "indexa-query"
description = "Hybrid FTS5 + vector search and RAG Q&A pipeline for Indexa."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
indexa-core = { path = "../core" }
indexa-embed = { path = "../embed" }
indexa-llm = { path = "../llm" }
# `summarize_file`'s no-stored-chunks fallback parses the file directly (rather than reading
# raw bytes) so summaries-only mode still gets real extracted text for PDFs/DOCX/etc. `parsers`
# has no dependency back on `query`, so this edge is acyclic.
indexa-parsers = { path = "../parsers" }
async-trait.workspace = true
regex = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
hf-hub = { workspace = true }
tokenizers = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
rusqlite = { workspace = true }
# Integration tests in tests/ are separate crates: they only see dev-deps, so the
# normal deps used by the black-box harness are repeated here.
tokio = { workspace = true }
async-trait = { workspace = true }
indexa-core = { path = "../core" }
indexa-embed = { path = "../embed" }
indexa-llm = { path = "../llm" }
