[package]
name = "indexa-http-util"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Shared HTTP client construction and retry/backoff for Indexa's network adapters."

[dependencies]
tokio = { workspace = true }
# rustls (not native-tls) is a cross-compile invariant — see CLAUDE.md. reqwest 0.13
# renamed the feature from "rustls-tls" to "rustls" (features consolidated; TLS backend
# now uses aws-lc-rs + rustls-platform-verifier instead of the 0.12 webpki-roots/ring combo).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
