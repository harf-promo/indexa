[package]
name = "indexa-core"
description = "File walker, filesystem watcher, SQLite store, and graph model for Indexa."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ignore = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
toml = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
mime_guess = "2"
hyperpolyglot = "0.1"
sysinfo = { workspace = true }
hnsw_rs = { workspace = true }
sha2 = { workspace = true }
# `git diff` subprocess timeout for changed_impact (2.3) — no git2 dependency, shells
# out to the user's own git binary and bounds the wait so a hung child can't stall a tool call.
wait-timeout = { workspace = true }

[dev-dependencies]
tempfile = "3"
# `#[tokio::test(start_paused = true)]` — lets `run_watchdog`'s recovery-wait loop regression
# test run capped at `MAX_PAUSE_SECS` in virtual time instead of real seconds. The main
# [dependencies] tokio doesn't enable `test-util`, so it's added here.
tokio = { workspace = true, features = ["test-util"] }
