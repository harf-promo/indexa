[package]
name = "indexa-llm"
description = "Summary + answer generation adapters for Indexa (Ollama, Claude subscription, OpenAI, Anthropic, llama.cpp)."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
libc = "0.2"
tracing = { workspace = true }
async-trait = "0.1"
indexa-http-util = { path = "../http-util" }
serde_json = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
