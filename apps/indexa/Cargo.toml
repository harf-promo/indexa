[package]
name = "indexa"
description = "The local context engine for AI."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "indexa"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = "3"
sha2 = { workspace = true }
htmd = { workspace = true }
indexa-http-util = { path = "../../crates/http-util" }
indexa-cli = { path = "../../crates/cli" }
indexa-core = { path = "../../crates/core" }
indexa-parsers = { path = "../../crates/parsers" }
indexa-embed = { path = "../../crates/embed" }
indexa-llm = { path = "../../crates/llm" }
indexa-query = { path = "../../crates/query" }
indexa-web = { path = "../../crates/web" }
indexa-mcp = { path = "../../crates/mcp" }
indexa-update = { path = "../../crates/update" }

[dev-dependencies]
# The deep-watchdog regression test's stub Embedder impl uses the same async-trait the
# trait itself does (already in the tree via indexa-embed/indexa-llm et al.).
async-trait = { workspace = true }
# `#[tokio::test(start_paused = true)]` — lets the deep-command watchdog regression test run a
# recovery-wait loop capped at `MAX_PAUSE_SECS` in virtual time instead of real seconds. `full`
# (the main [dependencies] tokio) deliberately excludes `test-util`, so it's added here.
tokio = { workspace = true, features = ["test-util"] }
# Already in the tree (via indexa-update et al.); named directly so the status
# version-skew test can construct `semver::Version` values for `Skew` variants.
semver = { workspace = true }
# Scratch git repos for the git-poll (3.3) tests.
tempfile = { workspace = true }
# Already in the tree (via indexa-core); named directly so the git-poll staleness test
# can backdate a chunk's `indexed_at` — `ChunkRecord`/`Store` don't expose that column,
# it's always DB-defaulted to `unixepoch()` at insert time.
rusqlite = { workspace = true }
