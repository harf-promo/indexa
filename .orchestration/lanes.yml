# .orchestration/lanes.yml — indexa
# Rust workspace. verify matches ci.yml's actual steps exactly.
verify: "cargo fmt --all -- --check && cargo clippy --all-targets --all-features --locked && cargo test --all --locked"

hot_files:
  # Pure-addition edits by 2+ lanes — expect a trivial rebase, not a logic conflict.
  - crates/mcp/src/lib.rs                   # new-tool lane(s) register in tool_router()
  - crates/web/src/lib.rs                   # UI_JS/UI_CSS concat! lists — new fragments only
  - AGENTS.md                               # tool-count token; owned by whichever lane changes the MCP tool count
  - README.md                               # tool-count token; owned likewise
  - USAGE.md                                # tool-count token; owned likewise
  - docs/how-to/live-retrieval-over-mcp.md  # tool-count mention; owned likewise
  - CHANGELOG.md                            # every lane appends its own [Unreleased] bullet, never edits another's
  - crates/cli/src/lib.rs                   # Eval variant (lane A) + PluginAction::List variant (lane C) — non-adjacent
  - apps/indexa/src/main.rs                 # Eval arm (A) + Deep arm (B) + Plugin arm (C) — non-adjacent match arms

counters:
  mcp_tool_count: 53
  ui_js_fragment_count: 32
  ui_css_fragment_count: 23

# Rounds 1-4 (v0.78.0 -> v0.80.1) plus their critique-fix lanes are ALL merged and released.
# Territory below is historical only — kept for reference, not live. Superseded by round-5.
singleton_paths:
  # 2026-08-31 round-5 (two lanes, consolidation — no new features) — exclusive territory.
  - crates/core/src/resource.rs                  # watchdog-consolidation (new shared fn)
  - crates/query/src/worker.rs                   # watchdog-consolidation
  - crates/web/src/jobs_exec/watchdog.rs         # watchdog-consolidation
  - crates/web/src/jobs_exec/deep.rs             # watchdog-consolidation (call site only)
  - apps/indexa/src/commands/deep.rs             # watchdog-consolidation (call site only)
  - crates/http-util/src/lib.rs                  # http-client-consolidation (new fn)
  - crates/parsers/Cargo.toml                    # http-client-consolidation (new internal dep)
  - crates/parsers/src/plugin_directory.rs       # http-client-consolidation

# release.yml triggers on version tags (v*.*.*), not on merge to main — confirmed by
# reading the trigger. No merge-triggered deploy exists for this repo.
deploy_on_merge: []

setup:
  run: null
  copy_env: []
  ports: {}

required_checks: [ci]
merge: squash
force_push: blocked
serialized_ci: []
